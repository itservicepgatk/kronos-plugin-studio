[package]
name = "kronos-guard"
version = "1.0.0"
edition = "2021"
description = "KRONOS Guard & Moderation — anti-grief, punishments, vanish, chat guard, and compact block/chest audit log for Pumpkin 26.3"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
