[package]
name = "kronos-ranks"
version = "1.0.0"
edition = "2021"
description = "KRONOS Ranks & Hierarchy — 20-rank ecosystem (10 Donate tiers + 9 Department Staff ranks + Player), dual-track perks, Tab/Chat formatting, HR recruitment, and cross-plugin bridge for Pumpkin 26.3"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
